[project]
name = "clipco-worker"
version = "0.1.0"
description = "Clipco local indexing worker: FFmpeg, whisper.cpp, Ollama, SQLite."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20",
]

[project.scripts]
clipco-worker = "clipco_worker.cli:main"
clipco-mcp = "clipco_worker.mcp_server:main"
clipco-benchmark = "clipco_worker.benchmark:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: runs installed whisper.cpp and Ollama models (slow; opt in with -m real)"]
addopts = "-m 'not real'"
