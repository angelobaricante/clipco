[project]
name = "clipcon-worker"
version = "0.1.0"
description = "Clipcon local indexing worker: FFmpeg, whisper.cpp, Ollama, SQLite."
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.20",
]

[project.scripts]
clipcon-worker = "clipcon_worker.cli:main"
clipcon-mcp = "clipcon_worker.mcp_server:main"
clipcon-benchmark = "clipcon_worker.benchmark:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real: runs installed whisper.cpp and Ollama models (slow; opt in with -m real)"]
addopts = "-m 'not real'"
